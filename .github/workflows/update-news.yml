name: Update news

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 06:00 Korea time, every day
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch RSS feeds
        run: python scripts/fetch_news.py
      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update news $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
